<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Reading list — VanoLib Reader</title>
<link rel="icon" href="icons/32.png">
<style>
:root{--bg:#fbf9f5;--card:#fff;--tx:#1f2328;--mu:#6b6f76;--bd:#e7e2d8;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#18191c;--card:#222428;--tx:#ececec;--mu:#9aa0a6;--bd:#33363b;--ac:#6ea8ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 20px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}header img{width:34px;height:34px}
h1{font:600 24px Georgia,"Iowan Old Style",serif;margin:0;flex:1}
.tabs{display:flex;gap:6px;margin:0 0 14px}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
input.q{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:14px}
.it{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.it:hover{border-color:var(--ac)}.ic{flex:none;width:38px;height:48px;border-radius:5px;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 11px sans-serif}
.bd{flex:1;min-width:0}.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.m{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--bd);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.acts{display:flex;gap:4px}.acts button{border:1px solid var(--bd);background:none;color:var(--mu);border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;font-size:12.5px}
.acts button:hover{color:var(--ac);border-color:var(--ac)}.empty{color:var(--mu);text-align:center;padding:50px 10px}
.btn{border:1px solid var(--ac);color:var(--ac);background:none;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-weight:600}
.ft h2{font:600 12px -apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:26px 0 10px}
.fd{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.fd .t{cursor:pointer}.fd .t:hover{color:var(--ac)}
.hit{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--bd);cursor:pointer;font-size:13px;color:var(--mu)}.hit:hover{color:var(--tx)}
.hit b.p{flex:none;color:var(--ac);font-weight:600;width:44px}.hit mark{background:rgba(255,212,0,.55);color:inherit;border-radius:2px;padding:0 1px}
.idx{color:var(--mu);font-size:12px;margin-top:6px}
.btn.ghost{border-color:var(--bd);color:var(--mu);font-weight:500}.btn.ghost:hover{border-color:var(--ac);color:var(--ac)}
</style></head><body><main>
<header><img src="icons/48.png" alt=""><h1>Reading list</h1><button class="btn ghost" id="exp" title="Save all your highlights, drawings, texts and comments in one file">Export annotations</button><button class="btn ghost" id="imp" title="Add the annotations of an exported file (nothing is overwritten)">Import…</button><input type="file" id="impf" accept=".json,application/json" hidden><button class="btn" id="open">Open a PDF…</button></header>
<div id="note" class="idx" style="margin:-8px 0 12px"></div>
<div class="tabs"><button data-t="saved" class="on">★ Saved <span id="nS"></span></button><button data-t="recent">Recently opened <span id="nR"></span></button></div>
<input class="q" id="q" placeholder="Search titles, addresses — and the full text of your saved PDFs…">
<div id="list"></div>
<div id="ft"></div>
</main><script src="pdf.min.js"></script><script src="store.js"></script><script src="library.js"></script></body></html>

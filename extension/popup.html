<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
body{width:290px;margin:0;padding:14px 16px;font:13px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#1f2328;background:#fbf9f5}
h1{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}h1 img{width:20px;height:20px}
label{display:flex;align-items:center;gap:8px;margin:8px 0}small{color:#6b6f76;display:block;margin-top:8px}
input[type=number]{width:70px;padding:3px 6px;border:1px solid #ddd;border-radius:6px}
button{margin-top:8px;width:100%;padding:7px;border:1px solid #2563eb;color:#2563eb;background:#fff;border-radius:8px;cursor:pointer;font-weight:600}
button.pri{background:#2563eb;color:#fff}
.rl{margin:8px 0 0;padding:0;list-style:none}.rl li{padding:5px 8px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl li:hover{background:#f1ebe0}.rl li span{color:#6b6f76;font-size:11.5px}h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#6b6f76;margin:12px 0 0}
</style><link rel="stylesheet" href="reading-theme.css"></head><body class="vl-theme-popup">
<h1><img src="icons/48.png" alt="">VanoLib Reader</h1>
<button class="pri" id="list">☰ Reading list <span id="n"></span></button>
<h2 id="h2" hidden>Saved — continue reading</h2><ul class="rl" id="rl"></ul>
<label>Reading colours <span id="vl-popup-theme"></span></label>
<button id="current">Read this article / find a free version</button>
<button id="open">Open a PDF from my computer…</button>
<label><input type="checkbox" id="auto"> Open PDFs automatically</label>
<label>VanoAtlas port <input type="number" id="port" min="1" max="65535"></label>
<small id="nh"></small>
<small>If Scholar PDF Reader is also installed, turn it off to avoid both readers opening PDFs.</small>
<script src="reading-theme.js"></script><script src="store.js"></script><script src="popup.js"></script></body></html>
